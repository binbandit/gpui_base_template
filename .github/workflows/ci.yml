name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Test
        run: cargo test --all-targets --locked

      - name: Doc tests
        run: cargo test --doc --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Shellcheck setup script
        run: shellcheck setup.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "msrv=$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.msrv }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --all-targets --locked

  platform:
    name: Host check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check native host
        run: cargo check --all-targets --locked

  setup-script:
    name: Setup (${{ matrix.mode.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode:
          - name: default
            flags: ""
          - name: app-only
            flags: "--app-only"
          - name: minimal
            flags: "--minimal"
          - name: no-examples
            flags: "--no-examples"
          - name: fresh-git
            flags: "--app-only --fresh-git"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure adversarial Git identity
        run: |
          git config user.name 'CI "Quoted" User'
          git config user.email 'ci@example.com'

      - name: Run setup
        run: ./setup.sh my-test-app ${{ matrix.mode.flags }} --yes

      - name: Validate result
        run: |
          test ! -e setup.sh
          test -z "$(find . -path './target' -prune -o -name '*.bak' -print -quit)"
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets --all-features -- -D warnings

  setup-rollback:
    name: Setup transaction rollback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: A failed generated build restores the input tree
        run: |
          printf '\nfn setup_rollback_probe() { missing_setup_symbol(); }\n' >> src/main.rs
          cp Cargo.toml "$RUNNER_TEMP/Cargo.toml.before"
          cp README.md "$RUNNER_TEMP/README.md.before"
          cp src/main.rs "$RUNNER_TEMP/main.rs.before"
          printf 'Keep my existing backup\n' > Cargo.toml.bak
          cp Cargo.toml.bak "$RUNNER_TEMP/existing-backup.before"
          if ./setup.sh rollback-test --app-only --yes; then
            echo "setup unexpectedly succeeded" >&2
            exit 1
          fi
          cmp Cargo.toml "$RUNNER_TEMP/Cargo.toml.before"
          cmp README.md "$RUNNER_TEMP/README.md.before"
          cmp src/main.rs "$RUNNER_TEMP/main.rs.before"
          test -e setup.sh
          cmp Cargo.toml.bak "$RUNNER_TEMP/existing-backup.before"
          rm Cargo.toml.bak
          test -z "$(find . -path './target' -prune -o -name '*.bak' -print -quit)"
